- id: arc42-lint
  name: arc42 Architecture Drift & Consistency Gate
  description: Deterministically checks for stale or drifting arc42 architecture documentation before commit
  entry: arc42-lint --pre-commit
  language: python
  pass_filenames: false
  always_run: true

- id: osv-scanner
  name: OSV-Scanner Dependency CVE Gate
  description: Fast polyglot vulnerability scanner for dependency manifests and lockfiles
  entry: osv-scanner-gate --staged
  language: python
  pass_filenames: false
  always_run: true
